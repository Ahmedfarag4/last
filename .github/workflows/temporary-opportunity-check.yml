name: Opportunity feature build check
on:
  push:
    branches:
      - feature/opportunity-progression-arabic-cinematics
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364e9b4d0a # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Enable package manager
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: TypeScript check
        run: corepack pnpm exec tsc --noEmit
      - name: Next.js production build
        run: corepack pnpm run build
